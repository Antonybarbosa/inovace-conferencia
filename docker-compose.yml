version: '3.3'

services:
  backend:
    build: ./backend
    container_name: conferencia-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: conferencia-frontend
    ports:
      # Porta do host configurável: defina FRONTEND_PORT no .env da raiz
      # se a 80 já estiver ocupada (ex.: FRONTEND_PORT=8080)
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
